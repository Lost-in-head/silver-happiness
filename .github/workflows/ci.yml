name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: social

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: social/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium (for Reddit adapter tests)
        run: python -m playwright install chromium --with-deps
        continue-on-error: true   # non-fatal if display is unavailable in CI

      - name: Run tests
        run: python -m pytest --tb=short -q
        env:
          LOG_LEVEL: WARNING

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build bot image
        run: docker build -t social-bot:ci ./social

      - name: Build API image (reuses the same Dockerfile)
        run: docker build -t social-api:ci ./social

      - name: Health-check API container
        run: |
          docker run -d --name api-check \
            -p 8000:8000 \
            -e OPENROUTER_API_KEY=dummy \
            -e API_KEYS="" \
            --entrypoint python \
            social-api:ci serve.py --host 0.0.0.0 --port 8000
          sleep 5
          curl --fail http://localhost:8000/health
          docker rm -f api-check
